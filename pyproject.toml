[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "profanity-diarization"
version = "0.1.0"
description = "Offline profanity detection and speaker diarization for movies/video clips (Whisper + pyannote)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Rusheil Singh Baath" }]
keywords = ["whisper", "pyannote", "speaker-diarization", "speech-to-text", "profanity-detection", "content-moderation", "offline"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["pydantic>=2", "pyyaml", "typer>=0.9", "numpy"]

[project.optional-dependencies]
# heavy model stack; tests never need it
models = ["openai-whisper==20240930", "pyannote.audio==3.3.2", "torch", "torchaudio", "nltk", "huggingface_hub"]
dev = ["pytest", "pytest-cov", "ruff"]

[project.urls]
Paper = "https://doi.org/g9kfph"

[project.scripts]
profanity-diarization = "profanity_diarization.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
profanity_diarization = ["presets/*.yaml", "lexicon/*.txt"]

[tool.pytest.ini_options]
addopts = "-m 'not slow and not models'"
markers = ["slow: slow tests", "models: needs real models/network"]
testpaths = ["tests"]
pythonpath = ["."]  # tests import the top-level eval/ package

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["legacy"]  # original paper scripts, kept unchanged
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long lines are left to ruff format. UP045: pydantic/typer evaluate annotations at runtime,
# so `X | None` would break Python 3.9.
ignore = ["E501", "UP045"]
